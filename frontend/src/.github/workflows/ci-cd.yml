name: CI-CD Vehicle ML Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training
        run: |
          cd projet_vehicules/frontend/src
          python train.py

      - name: Start API
        run: |
          cd projet_vehicules/frontend/src
          uvicorn serve_api:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run API test
        run: |
          cd projet_vehicules/frontend/src
          python test_api.py